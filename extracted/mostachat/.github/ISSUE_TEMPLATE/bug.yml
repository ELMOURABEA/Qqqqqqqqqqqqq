name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: textarea
    id: description
    attributes: {label: What happened?, description: "Never paste secrets or customer data."}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps}
    validations: {required: true}
