name: Production Health
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          response=$(curl --fail --silent --show-error --max-time 20 "$HEALTH_URL")
          echo "$response"
          echo "$response" | grep '"status":"healthy"'
